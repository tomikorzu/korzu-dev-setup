packages:
  - "apps/*"
  - "packages/*"

# @expo/cli and expo-router use react-dom for `expo export`'s static web rendering, but neither
# declares it as a dependency or peerDependency — they expect it hoisted. In a monorepo with web
# (React 19) and mobile (React 18) both present, pnpm's default hoist can only expose one shared
# react-dom copy, so the wrong major version leaks into whichever app resolves it second, causing
# "Objects are not valid as a React child" during static export. Declaring the peerDependency here
# makes pnpm resolve react-dom/react per-consumer (from whichever app actually depends on these
# packages) instead of relying on a single ambiguous hoisted copy.
packageExtensions:
  "@expo/cli":
    peerDependencies:
      react: "*"
      react-dom: "*"
  expo-router:
    peerDependencies:
      react: "*"
      react-dom: "*"
