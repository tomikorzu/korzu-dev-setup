name: CI

on:
  push:
    branches: [production]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e-scaffold:
    runs-on: ubuntu-latest
    needs: cli
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: scaffold a standalone frontend
        run: |
          mkdir -p /tmp/e2e
          cd /tmp/e2e
          node ${{ github.workspace }}/dist/cli.js --yes --name=e2e-web --frontend --no-install --no-git
          cd e2e-web
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: scaffold a standalone backend (REST)
        run: |
          cd /tmp/e2e
          node ${{ github.workspace }}/dist/cli.js --yes --name=e2e-api --backend rest --no-install --no-git
          cd e2e-api
          pnpm install
          npx prisma generate
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: scaffold a standalone mobile app
        run: |
          cd /tmp/e2e
          node ${{ github.workspace }}/dist/cli.js --yes --name=e2e-mobile --mobile --no-install --no-git
          cd e2e-mobile
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: scaffold a standalone CMS
        run: |
          cd /tmp/e2e
          node ${{ github.workspace }}/dist/cli.js --yes --name=e2e-cms --cms --no-install --no-git
          cd e2e-cms
          pnpm install
          pnpm lint
          pnpm typecheck

  template-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: korzu_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/korzu_api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  template-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  template-cms:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/cms
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: korzu_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: korzu_cms
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      APP_KEYS: ci-key-1,ci-key-2
      API_TOKEN_SALT: ci-api-token-salt
      ADMIN_JWT_SECRET: ci-admin-jwt-secret
      TRANSFER_TOKEN_SALT: ci-transfer-token-salt
      ENCRYPTION_KEY: ci-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/cms/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  template-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: templates/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
